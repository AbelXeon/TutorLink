<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0a0a0a"/>

  <!-- faint grid texture -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- half-cropped ring motif, bleeding off the right edge -->
  <circle cx="1180" cy="230" r="190" fill="none" stroke="#1350e0" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="1180" cy="230" r="190" fill="url(#glow)"/>
  <radialGradient id="glow" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#1350e0" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1350e0" stop-opacity="0"/>
  </radialGradient>

  <!-- small secondary ring -->
  <circle cx="1040" cy="90" r="60" fill="none" stroke="#1350e0" stroke-opacity="0.5" stroke-width="1"/>

  <!-- eyebrow label -->
  <text x="90" y="95" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#7d92c9">CONNECTING MINDS ACROSS ETHIOPIA</text>

  <!-- wordmark -->
  <text x="86" y="185" font-family="'Bebas Neue', Arial, sans-serif" font-size="96" letter-spacing="2" fill="#ffffff">TUTOR<tspan fill="#1350e0">LINK</tspan></text>

  <!-- baseline rule -->
  <line x1="90" y1="215" x2="330" y2="215" stroke="#1350e0" stroke-width="3"/>

  <!-- tagline -->
  <text x="90" y="250" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b5b5b5">Verified tutors. Real subjects. One platform.</text>
</svg>
